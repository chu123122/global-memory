name: OSS Readiness

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  readiness:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      CLAUDE_HOME: ${{ github.workspace }}\.claude-ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch git tags
        shell: pwsh
        run: git fetch --tags --force

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Bootstrap isolated Claude home
        shell: pwsh
        run: python bootstrap.py install

      - name: Run release-readiness unit tests
        shell: pwsh
        run: python -m unittest harness.tests.test_release_issue_ledger harness.tests.test_verify_output_contracts harness.tests.test_oss_readiness_check harness.tests.test_governance_pulse

      - name: Check generated catalogs
        shell: pwsh
        run: python harness\generate_catalog.py --check --json

      - name: Diagnose failing work scripts
        shell: pwsh
        run: |
          $scripts = @(
            "harness\work_context_pack.py --json",
            "harness\work_context_pack.py --intent 新开一个维护 task --json",
            "harness\check_prepare.py --json"
          )
          foreach ($s in $scripts) {
            Write-Host "=== RUN: $s ==="
            python $s 2>&1
            Write-Host "=== EXIT: $LASTEXITCODE ==="
          }
        continue-on-error: true

      - name: Validate machine-readable release outputs
        shell: pwsh
        run: |
          python harness\verify\verify_output_contracts.py --json 2>&1 | Tee-Object -FilePath voc_diag.txt
          $code = $LASTEXITCODE
          Write-Host "=== verify_output_contracts exit=$code ==="
          Get-Content voc_diag.txt -Tail 60
          if ($code -ne 0) { exit $code }

      - name: Upload verify diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-diagnostics
          path: voc_diag.txt
          if-no-files-found: ignore

      - name: Emit current release checkpoint
        shell: pwsh
        run: python harness\maintain.py release-checkpoint --json

      - name: Emit current release gap table
        shell: pwsh
        run: python harness\maintain.py release-gaps --json

      - name: Emit current owner decision queue
        shell: pwsh
        run: python harness\maintain.py release-decisions --json

      - name: Run OSS readiness profile
        shell: pwsh
        run: |
          python harness\maintain.py release-check --profile oss --json --skip-output-contracts 2>&1 | Tee-Object -FilePath rc_report.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== release-check failed ==="
            Get-Content rc_report.txt -Tail 30
            exit $LASTEXITCODE
          }

      - name: Upload release-check diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-diagnostics
          path: rc_report.txt
          if-no-files-found: ignore
