sources:
  - id: global-memory
    root: ~/.claude/global-memory
    enabled: true
    source_type: canonical_memory
    priority: 100
    include:
      - feedback/**/*.md
      - knowledge/**/*.md
      - fixes/**/*.md
      - decisions/**/*.md
      - docs/**/*.md
      - rules/**/*.md
      - agents/**/*.md
      - AGENTS.md
    exclude:
      - "**/_archive/**"
      - "**/.git/**"
  - id: claude-tasks
    root: ~/.claude/tasks
    enabled: true
    source_type: task_docs
    priority: 60
    include:
      - active/*/core/HANDOFF.md
      - active/*/core/STATUS.md
      - active/*/core/背景.md
      - active/*/design/设计文档.md
      - active/*/design/Phase*.md
      - active/*/test/测试.md
      - active/*/ops/CHANGELOG.md
      - active/*/ops/决策队列.md
    exclude:
      - "**/reference/**"
      - "**/node_modules/**"
      - "**/.git/**"
      - "**/unity-project/**"
      - "**/backup-*"
      - "**/backup-*/**"
      - "**/*.backup-*"
      - "**/*.backup-*/**"
